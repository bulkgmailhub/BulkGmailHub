<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>BulkGmailHub</title>
    <script>
      // Single Page Apps for GitHub Pages & Static Hosts
      // Preserves clean URL path without hashtag
      var isGitHubPages = window.location.hostname.indexOf('github.io') > -1;
      var pathSegmentsToKeep = isGitHubPages ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to BulkGmailHub...</p>
  </body>
</html>
