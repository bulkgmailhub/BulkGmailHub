<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgh-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#C5221F" />
    </linearGradient>
    <linearGradient id="bgh-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>
    <linearGradient id="bgh-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#1E8E3E" />
    </linearGradient>
    <linearGradient id="bgh-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC04" />
      <stop offset="100%" stop-color="#F29900" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0F172A" />

  <!-- Inner Envelope / Mail Branding Icon -->
  <g transform="translate(10, 14)" filter="url(#shadow)">
    <!-- Main envelope bottom body -->
    <path d="M4 14.5 L22 26 L40 14.5 V32 C40 34.2 38.2 36 36 36 H8 C5.8 36 4 34.2 4 32 Z" fill="#F8FAFC" opacity="0.9" />

    <!-- Left pillar (Green) -->
    <path d="M4 8 C4 5.8 5.8 4 8 4 L14 4 V28 L4 21 Z" fill="url(#bgh-green)" />

    <!-- Right pillar (Blue) -->
    <path d="M40 8 C40 5.8 38.2 4 36 4 L30 4 V28 L40 21 Z" fill="url(#bgh-blue)" />

    <!-- Top fold / Roof (Red & Yellow) -->
    <path d="M8 4 L22 14.5 L36 4 C34.5 4 10 4 8 4 Z" fill="url(#bgh-yellow)" />
    <path d="M14 4 L22 14.5 L30 4 Z" fill="url(#bgh-red)" />
    
    <!-- Dynamic Hub Checkpoint Badge -->
    <circle cx="37" cy="6" r="4.5" fill="#10B981" stroke="#0F172A" stroke-width="1.5" />
  </g>
</svg>
